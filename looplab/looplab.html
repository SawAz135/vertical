<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LOOPLAB — Vidéos hypnotiques</title>
<meta name="description" content="Crée des vidéos verticales hypnotiques et satisfaisantes synchronisées sur la musique, directement dans ton navigateur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* LOOPLAB — interface */
:root {
  --bg: #07070b; --bg2: #0d0d14; --card: #12121b; --card2: #181824; --bd: #24243a; --bd2: #33334d;
  --tx: #f3f3f8; --mu: #9b9bb4; --mu2: #6f6f88;
  --a1: #c6ff3d; --a2: #3de1ff; --a3: #8b5cff; --hot: #ff4d8d;
  --grad: linear-gradient(100deg, var(--a1), var(--a2) 48%, var(--a3));
  --r: 18px; --r2: 26px;
  --shadow: 0 18px 50px -18px rgba(0, 0, 0, .8);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--tx); }
body { font: 15px/1.45 Inter, system-ui, -apple-system, Segoe UI, sans-serif; min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
  background: radial-gradient(40vmax 30vmax at 15% 0%, rgba(139, 92, 255, .16), transparent 70%),
              radial-gradient(40vmax 30vmax at 90% 10%, rgba(61, 225, 255, .1), transparent 70%),
              radial-gradient(50vmax 40vmax at 50% 110%, rgba(198, 255, 61, .06), transparent 70%);
  animation: drift 24s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(2vmax, 3vmax, 0) rotate(4deg); } }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.display { font-family: Unbounded, Inter, system-ui, sans-serif; letter-spacing: -.01em; }
.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); background: rgba(7, 7, 11, .72); border-bottom: 1px solid rgba(255, 255, 255, .05); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; }
.logo svg { width: 30px; height: 30px; }
.logo .orb { transform-origin: 50% 50%; animation: spin 6s linear infinite; }
.logo .orb2 { transform-origin: 50% 50%; animation: spin 9s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--bd); background: var(--card); padding: 9px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; transition: transform .15s, border-color .2s; }
.pill:hover { border-color: var(--bd2); }
.pill:active { transform: scale(.96); }
.pill .n { background: var(--grad); color: #07070b; border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 900; }

main { max-width: 1180px; margin: 0 auto; padding: 0 16px 120px; }
.view { animation: viewIn .45s cubic-bezier(.2, .9, .2, 1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px) scale(.99); filter: blur(4px); } }

/* ---------- home ---------- */
.hero { position: relative; margin: 18px 0 8px; padding: 26px 22px; border-radius: var(--r2); overflow: hidden;
  background: linear-gradient(160deg, rgba(139, 92, 255, .18), rgba(61, 225, 255, .06) 55%, rgba(198, 255, 61, .05)); border: 1px solid rgba(255, 255, 255, .08); }
.hero::after { content: ''; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%;
  border: 1px dashed rgba(255, 255, 255, .15); animation: spin 40s linear infinite; }
.hero .hi { color: var(--mu); font-weight: 600; }
.hero h1 { margin: 6px 0 10px; font-size: clamp(30px, 7.5vw, 52px); line-height: 1.02; }
.hero p { margin: 0; color: #d6d6e6; max-width: 640px; }
.hero p b { color: #fff; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--bd); background: var(--card); color: var(--mu); border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 13px; transition: all .2s; }
.chip.on { color: #07070b; background: var(--tx); border-color: var(--tx); }
.sec { margin: 30px 0 12px; }
.sec h2 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
.sec h2 .cnt { font: 700 12px Inter; color: var(--mu); background: var(--card); border: 1px solid var(--bd); border-radius: 999px; padding: 2px 9px; }
.sec p { margin: 4px 0 0; color: var(--mu); }

.top3 { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 14px; overflow-x: auto; padding: 6px 2px 14px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.top3::-webkit-scrollbar { display: none; }
.tcard { scroll-snap-align: start; position: relative; border-radius: var(--r2); overflow: hidden; background: var(--card); border: 1px solid var(--bd);
  box-shadow: var(--shadow); transition: transform .35s cubic-bezier(.2, .9, .2, 1), border-color .3s; }
.tcard:hover { transform: translateY(-4px); border-color: var(--bd2); }
.tcard .live { aspect-ratio: 9 / 16; width: 100%; display: block; background: #000; }
.tcard .meta { position: absolute; inset: auto 0 0 0; padding: 70px 16px 16px; background: linear-gradient(transparent, rgba(0, 0, 0, .92)); }
.tcard .meta h3 { margin: 4px 0 4px; font-size: 21px; }
.tcard .meta p { margin: 0 0 12px; color: #d0d0e0; font-size: 13px; }
.badge { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: .02em; padding: 4px 9px; border-radius: 999px; background: rgba(255, 255, 255, .12); backdrop-filter: blur(8px); }
.badge.hot { background: linear-gradient(90deg, #ff4d8d, #ff8a3d); color: #fff; }
.badge.new { background: var(--grad); color: #07070b; }
.cta-sm { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; padding: 10px 14px; border-radius: 999px; background: #fff; color: #07070b; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 960px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.card { position: relative; border-radius: var(--r); overflow: hidden; background: var(--card); border: 1px solid var(--bd); display: flex; flex-direction: column;
  transition: transform .3s cubic-bezier(.2, .9, .2, 1), border-color .3s, box-shadow .3s; }
.card:hover { transform: translateY(-3px); border-color: var(--bd2); box-shadow: var(--shadow); }
.card:active { transform: scale(.98); }
.card .thumb { aspect-ratio: 9 / 13; width: 100%; display: block; background: linear-gradient(135deg, #15151f, #0b0b10); object-fit: cover; }
.card .thumb.loading { background: linear-gradient(100deg, #12121b 30%, #1d1d2b 50%, #12121b 70%); background-size: 300% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -100% 0; } }
.card .body { padding: 10px 12px 12px; }
.card h4 { margin: 0 0 2px; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; }
.card h4 span { color: var(--a1); font: 700 11px Inter; white-space: nowrap; }
.card p { margin: 0; color: var(--mu); font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .tags { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }

/* ---------- editor ---------- */
.back { display: inline-flex; gap: 8px; align-items: center; color: var(--mu); font-weight: 700; margin: 16px 0 6px; }
.ed-head h1 { margin: 2px 0 4px; font-size: clamp(26px, 6vw, 40px); }
.ed-head p { margin: 0; color: var(--mu); }
.editor { display: grid; gap: 20px; margin-top: 16px; }
@media (min-width: 900px) { .editor { grid-template-columns: 410px 1fr; align-items: start; } .stage { position: sticky; top: 84px; } }
.stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.phone { position: relative; width: min(100%, 360px, calc((100vh - 230px) * .5625)); min-width: 220px; aspect-ratio: 9 / 16; border-radius: 34px; padding: 10px;
  background: linear-gradient(160deg, #2a2a3a, #0d0d13 40%, #1b1b28); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .9), inset 0 0 0 1px rgba(255, 255, 255, .08); }
.phone canvas { width: 100%; height: 100%; display: block; border-radius: 26px; background: #000; }
.phone .notch { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); width: 84px; height: 22px; border-radius: 999px; background: #000; z-index: 2; opacity: .85; }
.phone .ov { position: absolute; inset: 10px; border-radius: 26px; display: grid; place-items: center; transition: opacity .3s; cursor: pointer; }
.phone .ov.hide { opacity: 0; pointer-events: none; }
.phone .ov .big { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .14); backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, .25); box-shadow: 0 0 0 0 rgba(198, 255, 61, .5); animation: ping 2.2s infinite; }
@keyframes ping { 70% { box-shadow: 0 0 0 22px rgba(198, 255, 61, 0); } 100% { box-shadow: 0 0 0 0 rgba(198, 255, 61, 0); } }
.ctrl { width: min(100%, 380px); display: flex; align-items: center; gap: 8px; }
.ib { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1px solid var(--bd); background: var(--card); display: grid; place-items: center; transition: transform .12s; }
.ib:active { transform: scale(.92); }
.ib svg { width: 18px; height: 18px; }
.tl { position: relative; flex: 1; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--bd); overflow: hidden; touch-action: none; cursor: pointer; }
.tl .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(139, 92, 255, .35), rgba(61, 225, 255, .35)); }
.tl .drop { position: absolute; top: 4px; bottom: 4px; width: 2px; background: var(--a1); box-shadow: 0 0 10px var(--a1); }
.tl .drop::after { content: 'DROP'; position: absolute; top: -1px; left: 5px; font: 800 9px Inter; color: var(--a1); }
.tl .time { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 700 12px Inter; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; }
.hint { color: var(--mu2); font-size: 12px; text-align: center; max-width: 360px; }

.panels { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--card); border: 1px solid var(--bd); border-radius: var(--r2); padding: 16px; }
.panel > h3 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
.panel > h3 small { font: 600 12px Inter; color: var(--mu); }
.panel .sub { color: var(--mu); font-size: 12px; margin: 8px 0 0; }
.themes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 520px) { .themes { grid-template-columns: repeat(3, 1fr); } }
.th { border: 1.5px solid var(--bd); border-radius: 14px; padding: 8px; background: var(--bg2); text-align: left; transition: transform .15s, border-color .2s; }
.th.on { border-color: var(--a1); box-shadow: 0 0 0 3px rgba(198, 255, 61, .15); }
.th:active { transform: scale(.96); }
.th .sw { display: flex; height: 26px; border-radius: 8px; overflow: hidden; }
.th .sw i { flex: 1; }
.th span { display: block; margin-top: 6px; font-weight: 700; font-size: 12px; }
.mats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mat { border: 1.5px solid var(--bd); border-radius: 14px; padding: 10px 6px; background: var(--bg2); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; transition: border-color .2s, transform .15s; }
.mat canvas { width: 46px; height: 46px; }
.mat.on { border-color: var(--a1); box-shadow: 0 0 0 3px rgba(198, 255, 61, .15); }
.mat:active { transform: scale(.95); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 64px; border: 1.5px solid var(--bd); background: var(--bg2); border-radius: 12px; padding: 10px 8px; font-weight: 700; font-size: 13px; transition: all .15s; }
.seg button.on { border-color: var(--a1); color: var(--a1); background: rgba(198, 255, 61, .07); }
.row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.row label { flex: 1; font-weight: 600; font-size: 13px; }
.field { width: 100%; border: 1.5px solid var(--bd); background: var(--bg2); border-radius: 12px; padding: 11px 12px; color: var(--tx); font: inherit; }
.field:focus { outline: none; border-color: var(--a2); }
.olabel { font-weight: 700; font-size: 13px; margin: 14px 0 8px; color: #dcdcea; }
.olabel:first-child { margin-top: 0; }
.tog { position: relative; width: 46px; height: 28px; flex: none; border-radius: 999px; background: var(--bd); border: 0; transition: background .2s; }
.tog::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.3, 1.5, .5, 1); }
.tog.on { background: linear-gradient(90deg, var(--a1), var(--a2)); }
.tog.on::after { transform: translateX(18px); }
.fx { display: flex; gap: 8px; flex-wrap: wrap; }
.fx button { border: 1.5px solid var(--bd); background: var(--bg2); border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 13px; color: var(--mu); }
.fx button.on { color: #07070b; background: var(--tx); border-color: var(--tx); }
input[type=range] { width: 100%; accent-color: var(--a1); }
.slider-v { font: 800 18px Unbounded; color: var(--a1); }
.ent { display: grid; grid-template-columns: 34px 44px 1fr 40px 34px; gap: 6px; align-items: center; margin-bottom: 6px; }
.ent input[type=color] { width: 34px; height: 34px; border: 0; padding: 0; background: none; border-radius: 10px; overflow: hidden; }
.ent .emo { text-align: center; padding: 8px 2px; }
.ent .ph { width: 40px; height: 40px; border-radius: 50%; border: 1.5px dashed var(--bd2); background: var(--bg2) center / cover; display: grid; place-items: center; font-size: 16px; }
.ent .x { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--bd); background: var(--bg2); color: var(--mu); }
.btn2 { border: 1.5px dashed var(--bd2); background: transparent; border-radius: 12px; padding: 10px 12px; font-weight: 700; color: var(--mu); width: 100%; }
.imgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.imgs label { aspect-ratio: 1; border-radius: 14px; border: 1.5px dashed var(--bd2); background: var(--bg2) center / cover; display: flex; align-items: flex-end; justify-content: center; font-size: 10px; font-weight: 700; color: var(--mu); padding: 4px; cursor: pointer; text-align: center; }
.imgs input, .filein { display: none; }
.musicinfo { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--bd); font-size: 12.5px; color: #d7d7e6; }
.musicinfo b { color: var(--a1); }
.out { font-size: 12px; color: var(--mu); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--bd); background: var(--bg2); margin-top: 12px; }

.gen { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 16px calc(12px + var(--safe-b)); background: linear-gradient(transparent, rgba(7, 7, 11, .92) 30%); }
.gen button { display: block; width: min(100%, 620px); margin: 0 auto; border: 0; border-radius: 18px; padding: 17px 20px; font: 800 16px Unbounded; color: #07070b;
  background: var(--grad); background-size: 200% 100%; animation: sheen 4s ease-in-out infinite; box-shadow: 0 14px 40px -10px rgba(61, 225, 255, .55); transition: transform .15s; }
.gen button:active { transform: scale(.97); }
.gen button:disabled { opacity: .5; }
@keyframes sheen { 50% { background-position: 100% 0; } }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(3, 3, 6, .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; } }
.mbox { width: min(100%, 440px); max-height: calc(100vh - 32px); overflow: auto; background: var(--card); border: 1px solid var(--bd); border-radius: 28px; padding: 22px; text-align: center; animation: pop .5s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes pop { from { transform: scale(.88) translateY(20px); opacity: 0; } }
.mbox h3 { margin: 0 0 4px; font-size: 20px; }
.mbox p { color: var(--mu); margin: 0 0 14px; font-size: 13px; }
.rwrap { position: relative; width: 210px; margin: 8px auto 14px; aspect-ratio: 9 / 16; }
.rwrap canvas, .rwrap video { width: 100%; height: 100%; border-radius: 20px; display: block; background: #000; object-fit: cover; }
.rwrap svg.ring { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); pointer-events: none; }
.pct { font: 800 34px Unbounded; }
.stage-l { color: var(--mu); font-size: 13px; margin: 2px 0 14px; }
.mrow { display: flex; gap: 8px; }
.mrow > * { flex: 1; }
.btn { border: 1px solid var(--bd); background: var(--bg2); border-radius: 14px; padding: 13px 14px; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.p { border: 0; color: #07070b; background: var(--grad); }
.err { color: #ff8aa8; }
video.res { width: 100%; border-radius: 20px; background: #000; max-height: 60vh; }

/* ---------- videos ---------- */
.vgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
@media (min-width: 720px) { .vgrid { grid-template-columns: repeat(4, 1fr); } }
.vcard { border-radius: var(--r); overflow: hidden; border: 1px solid var(--bd); background: var(--card); text-align: left; padding: 0; }
.vcard img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; background: #000; }
.vcard div { padding: 8px 10px; font-size: 12px; color: var(--mu); }
.vcard b { color: var(--tx); display: block; font-size: 13px; }
.empty { text-align: center; color: var(--mu); padding: 60px 20px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%); z-index: 200; background: #fff; color: #07070b; font-weight: 800; font-size: 13px; padding: 11px 16px; border-radius: 999px; box-shadow: var(--shadow); animation: toast 2.6s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

</style>

  function loadImage(file, max = 512) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const out = new Image();
        out.onload = () => res(out);
        out.src = c.toDataURL("image/jpeg", 0.9);
        URL.revokeObjectURL(url);
      };
      img.onerror = rej;
      img.src = url;
    });
  }

      const tpl = TEMPLATES.find((t) => t.id === m[1]);
      page = tpl ? editorPage(tpl) : homePage();
    } else if (hash.startsWith("#/videos")) page = await videosPage();
    else page = homePage();
    view.replaceChildren(page);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
  refreshCount();
})();

</script>
</body>
</html>
