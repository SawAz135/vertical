<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Course preview</title>
<style>html,body{margin:0;background:#07060f;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Still preview of the generated course. This is NOT Roblox's renderer: it
// approximates the in-game look (night, neon + bloom, haze) so the map can be
// checked from a phone before publishing.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = new URLSearchParams(location.search);
const width = Number(params.get('w') || 1080);
const height = Number(params.get('h') || 1920);
const shot = params.get('shot') || 'hero';

const course = await (await fetch('/course.json')).json();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(width, height);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060f);
scene.fog = new THREE.FogExp2(0x1a1236, 0.0042);

// --- Sky: gradient dome + stars ------------------------------------------
{
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(1500, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: { top: { value: new THREE.Color(0x05040c) }, horizon: { value: new THREE.Color(0x2a1d5c) } },
      vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 top; uniform vec3 horizon; varying vec3 vP; void main(){ float t = pow(clamp(vP.y*0.5+0.5,0.0,1.0), 1.8); gl_FragColor = vec4(mix(horizon, top, smoothstep(0.45,1.0,t)), 1.0); }',
    }));
  scene.add(dome);

  const count = 4000, pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < count; i++) {
    const u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, r = 1200;
    const s = Math.sqrt(1 - u * u);
    pos.set([r * s * Math.cos(a), Math.abs(r * u) * 0.9 + 40, r * s * Math.sin(a)], i * 3);
    const warm = rnd();
    col.set([0.75 + warm * 0.25, 0.75 + rnd() * 0.15, 1.0 - warm * 0.2], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, vertexColors: true, fog: false, sizeAttenuation: false })));
}

// --- Lights -----------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0x6a58c8, 0x0b0820, 0.9));
const moon = new THREE.DirectionalLight(0xbfc8ff, 1.3);
moon.position.set(-120, 220, -60);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -260, right: 260, top: 260, bottom: -260, near: 1, far: 800 });
scene.add(moon);

// --- Parts --------------------------------------------------------------------
const box = new THREE.BoxGeometry(1, 1, 1);
const bounds = new THREE.Box3();
let lightBudget = 10;
for (const p of course.parts) {
  const color = new THREE.Color().setRGB(p.color[0], p.color[1], p.color[2], THREE.SRGBColorSpace);
  let material;
  if (p.material === 'Neon') {
    material = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2.4, roughness: 0.4 });
  } else if (p.material === 'Glass') {
    material = new THREE.MeshPhysicalMaterial({ color, emissive: color, emissiveIntensity: 0.35, roughness: 0.05, metalness: 0.0, transparent: true, opacity: 0.72, clearcoat: 1 });
  } else {
    material = new THREE.MeshStandardMaterial({ color, roughness: 0.38, metalness: 0.15 });
  }
  const mesh = new THREE.Mesh(box, material);
  const c = p.cframe;
  mesh.matrixAutoUpdate = false;
  mesh.matrix.set(
    c[3] * p.size[0], c[4] * p.size[1], c[5] * p.size[2], c[0],
    c[6] * p.size[0], c[7] * p.size[1], c[8] * p.size[2], c[1],
    c[9] * p.size[0], c[10] * p.size[1], c[11] * p.size[2], c[2],
    0, 0, 0, 1);
  mesh.castShadow = p.material !== 'Neon';
  mesh.receiveShadow = true;
  scene.add(mesh);
  bounds.expandByPoint(new THREE.Vector3(c[0], c[1], c[2]));
  if ((p.kind === 'Mover' || p.kind === 'Finish') && lightBudget-- > 0) {
    const light = new THREE.PointLight(color, p.kind === 'Finish' ? 1600 : 500, 40, 2);
    light.position.set(c[0], c[1] + 2, c[2]);
    scene.add(light);
  }
}

// --- Camera -------------------------------------------------------------------
const center = bounds.getCenter(new THREE.Vector3());
const camera = new THREE.PerspectiveCamera(shot === 'hero' ? 55 : 38, width / height, 0.5, 4000);
if (shot === 'hero') {
  // Behind and above the start pad, looking up the climb.
  camera.position.set(-16, bounds.min.y + 26, bounds.min.z - 34);
  camera.lookAt(center.x + 4, center.y + 6, center.z + 40);
} else {
  // Side overview of the whole course.
  camera.position.set(center.x - 190, center.y + 70, center.z - 70);
  camera.lookAt(center.x, center.y + 4, center.z + 20);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(width, height), 0.85, 0.55, 0.62));
composer.addPass(new OutputPass());
composer.render();
window.__done = true;
</script>
</body>
</html>
