<style>
@font-face{font-family:'F-Fredoka';src:url(../gui/fonts/fredoka-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'F-Mont';src:url(../gui/fonts/montserrat-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'F-Mont';src:url(../gui/fonts/montserrat-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
:root{--bg:#111216;--bg2:#191a1f;--card:#232527;--card2:#2c2e33;--line:rgba(255,255,255,.08);--text:#f7f7f8;--muted:#a9abb3;--faint:#6d7079;--blue:#335fff;--green:#00b06f;--green2:#02a364;--red:#ff4c4c;
  --ui:'F-Mont',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--game:'F-Fredoka',"Fredoka One",system-ui,sans-serif;--gs:1;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:600 15px/1.35 var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column}

/* ===================== HOME (app) ===================== */
#home{overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:rgba(17,18,22,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:5}
.logo{width:34px;height:34px;border-radius:9px;background:conic-gradient(from 20deg,#fff 0 25%,#d9d9de 0 50%,#fff 0 75%,#d9d9de 0);transform:rotate(14deg);box-shadow:inset 0 0 0 9px #fff;position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:11px;background:#111216;border-radius:2px}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
.top h1 small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.ico{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.me{width:40px;height:40px;border-radius:50%;background:var(--card2);overflow:hidden;border:0;padding:0;flex:none}
.me img{width:100%;height:100%;object-fit:cover}
.feed{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 calc(env(safe-area-inset-bottom) + 86px)}
.sec{padding:14px max(16px,env(safe-area-inset-left)) 4px}
.sec h2{margin:0 0 10px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec h2 small{font-size:12px;color:var(--muted);font-weight:700;margin-left:auto}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left)));padding-left:max(16px,env(safe-area-inset-left));padding-right:16px}
.row::-webkit-scrollbar{display:none}
.tile{flex:none;width:152px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;transition:transform .25s var(--spring)}
.tile:active{transform:scale(.95)}
.thumb{position:relative;width:152px;height:152px;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 0 0 1px var(--line) inset}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .gl{position:absolute;inset:0;display:grid;place-items:center;font-size:58px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.thumb .gl::before{content:"";position:absolute;left:14%;right:14%;bottom:12%;height:22%;background:rgba(0,0,0,.18);border-radius:50%;filter:blur(8px)}
.badge{position:absolute;left:7px;top:7px;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.6);letter-spacing:.02em}
.badge.live{background:var(--green)}
.tile b{display:block;margin-top:7px;font-size:13.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile small{display:flex;gap:8px;color:var(--muted);font-size:11.5px;margin-top:3px;font-weight:700}
.wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px 12px}
.wide .tile,.wide .thumb{width:100%}.wide .thumb{height:auto;aspect-ratio:1}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border-radius:12px;background:var(--bg2);box-shadow:0 0 0 1px var(--line) inset;line-height:1.5}
.drop{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#1d2a5a,#1a1b2a);box-shadow:0 0 0 1px rgba(110,140,255,.25) inset;margin-top:4px;width:100%;border:0;text-align:left}
.drop .di{width:46px;height:46px;border-radius:12px;background:var(--blue);display:grid;place-items:center;flex:none}
.drop b{display:block;font-size:14.5px}.drop small{display:block;color:#b8c4ff;font-size:12px;font-weight:600;margin-top:2px}
body.dragging .drop{box-shadow:0 0 0 2px #7d98ff inset;transform:scale(1.02)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(17,18,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 6px);z-index:6}
nav.tabs button,nav.tabs a{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:5px 0;text-decoration:none}
nav.tabs .on{color:#fff}nav.tabs svg{width:25px;height:25px}

/* sheet (game page) */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,0);transition:background .35s;pointer-events:none}
.sheet.on{background:rgba(0,0,0,.55);pointer-events:auto}
.sheet .pane{background:var(--bg);border-radius:20px 20px 0 0;max-height:94%;overflow-y:auto;transform:translateY(105%);transition:transform .45s var(--ease);padding-bottom:calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.on .pane{transform:none}
.hero{position:relative;aspect-ratio:16/9;background:var(--card);overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .gl{position:absolute;inset:0;display:grid;place-items:center;font-size:90px}
.hero .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);font-size:18px}
.grab{position:absolute;left:50%;top:8px;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);translate:-50% 0}
.info{padding:14px max(16px,env(safe-area-inset-left)) 0}
.info h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.info .by{color:var(--muted);font-size:13px;margin-top:3px}.info .by b{color:#7fb2ff}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:17px;font-weight:800;margin:14px 0 6px;box-shadow:0 6px 0 var(--green2),0 10px 24px -8px rgba(0,176,111,.6);transition:transform .12s,box-shadow .12s}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green2)}
.play svg{width:26px;height:26px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats3 div{background:var(--bg2);border-radius:10px;padding:9px 6px;text-align:center;box-shadow:0 0 0 1px var(--line) inset}
.stats3 b{display:block;font-size:15px}.stats3 small{color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.feat{list-style:none;padding:0;margin:4px 0 0}.feat li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:#d9dae0;font-weight:600}.feat li:last-child{border:0}
.btnrow{display:flex;gap:8px;margin-top:12px}.btn2{flex:1;height:44px;border:0;border-radius:10px;background:var(--card);font-weight:700;font-size:13.5px}.btn2.red{color:#ff8a8a}

/* avatar editor */
#avatar .stage{flex:none;height:46%;position:relative;background:radial-gradient(70% 70% at 50% 40%,#2a3247,#111216)}
#avatar canvas{width:100%;height:100%;display:block}
#avatar .opts{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 90px)}
.fld{margin-bottom:14px}.fld>label{display:block;font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:0;box-shadow:0 0 0 2px rgba(255,255,255,.12) inset;transition:transform .2s var(--spring)}
.sw button.on{box-shadow:0 0 0 3px #fff inset,0 0 0 2px var(--bg);transform:scale(1.12)}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{border:0;border-radius:999px;padding:8px 13px;background:var(--card);font-size:13px;font-weight:700}.chips button.on{background:#fff;color:#111}
.tinput{width:100%;height:44px;border:0;border-radius:10px;background:var(--card);padding:0 12px;font-size:16px}

/* loading (join) */
#loading{z-index:40;background:#000;align-items:center;justify-content:center;transition:opacity .6s}
#loading .bgimg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(24px) brightness(.45);transform:scale(1.1)}
#loading .box{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:0 24px}
#loading .lthumb{width:min(56vw,240px);aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);position:relative;background:var(--card);animation:lfloat 3s ease-in-out infinite}
#loading .lthumb img{width:100%;height:100%;object-fit:cover}
@keyframes lfloat{50%{transform:translateY(-6px) rotate(-.6deg)}}
#loading h3{margin:6px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em}
#loading .by{color:#c9cbd3;font-size:13.5px}
.spin{width:44px;height:44px;position:relative;margin-top:12px}
.spin i{position:absolute;inset:0;border-radius:9px;border:4px solid #fff;animation:sp 1.1s cubic-bezier(.6,0,.4,1) infinite}
.spin i:nth-child(2){inset:12px;border-radius:3px;background:#fff;border:0;animation-direction:reverse}
@keyframes sp{to{transform:rotate(360deg)}}
#loading .lt{font-size:13px;color:#c9cbd3;min-height:18px}
#loading .lbar{width:min(70vw,280px);height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
#loading .lbar i{display:block;height:100%;width:0;background:#fff;transition:width .3s var(--ease)}
#loading.out{opacity:0;pointer-events:none}

/* ===================== IN GAME ===================== */
#game{background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#game canvas.view{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
/* topbar (Roblox-style rounded dark buttons) */
.tb{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:max(10px,env(safe-area-inset-left));display:flex;gap:8px}
.tb button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(18,18,21,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;transition:transform .15s,background .15s;position:relative}
.tb button:active{transform:scale(.9);background:rgba(18,18,21,.82)}
.tb svg{width:24px;height:24px}
.tb .dot{position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px rgba(18,18,21,.8)}
.tb .pill{display:flex;gap:2px;padding:3px;border-radius:14px;background:rgba(18,18,21,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tb .pill button{width:40px;height:40px;border-radius:11px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.tb .pill button:active,.tb .pill button.on{background:rgba(255,255,255,.16)}
body:not(.desktop) .pc{display:none!important}
.hp{position:absolute;top:calc(env(safe-area-inset-top) + 58px);right:max(10px,env(safe-area-inset-right));width:min(42vw,200px);height:10px;border-radius:5px;background:rgba(0,0,0,.55);overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.hp i{display:block;height:100%;width:100%;transition:width .25s,background .25s}
.lb{top:calc(env(safe-area-inset-top) + 74px)!important}
.xhair{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;pointer-events:none;background:radial-gradient(circle,#fff 0 2px,transparent 2.5px),linear-gradient(#fff,#fff) center/2px 8px no-repeat}
.xhair::before,.xhair::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}.xhair::before{left:10px;top:0;width:2px;height:7px}.xhair::after{left:10px;bottom:0;width:2px;height:7px}
.emotes{position:absolute;inset:0;z-index:12;background:radial-gradient(circle,rgba(0,0,0,.35),rgba(0,0,0,.55));animation:fade .2s}
.wheel{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel button{position:absolute;width:76px;height:76px;margin:-38px;border-radius:50%;border:0;background:rgba(18,18,21,.78);box-shadow:0 0 0 2px rgba(255,255,255,.18) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;animation:wpop .35s var(--spring) backwards;transition:transform .15s,background .15s}
.wheel button:hover,.wheel button:active{transform:scale(1.12);background:rgba(255,255,255,.22)}
.wheel button span{font-size:30px;line-height:1}.wheel button small{font:700 10px var(--ui);color:#ddd}
.wheel .hub{position:absolute;width:120px;height:120px;margin:-60px;border-radius:50%;background:rgba(18,18,21,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 16px var(--ui);box-shadow:0 0 0 2px rgba(255,255,255,.12) inset}
.wheel .hub small{font:700 10.5px var(--ui);color:#aaa;margin-top:3px;text-align:center;padding:0 10px}
@keyframes wpop{from{transform:scale(.2);opacity:0}}
/* leaderboard (player list) */
.lb{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:max(10px,env(safe-area-inset-right));min-width:150px;max-width:calc(100vw - 186px);border-radius:10px;overflow:hidden;background:rgba(18,18,21,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13px;transition:transform .3s var(--ease),opacity .3s}
.lb.min{transform:translateX(calc(100% + 20px));opacity:0}
.lb table{border-collapse:collapse;width:100%}
.lb th{font-size:11px;font-weight:700;color:#cfd0d6;padding:6px 9px;text-align:right;white-space:nowrap;background:rgba(0,0,0,.25)}
.lb th:first-child,.lb td:first-child{text-align:left}
.lb td{padding:7px 9px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.lb td:first-child{display:flex;align-items:center;gap:7px}
.lb td:first-child i{width:20px;height:20px;border-radius:50%;background:#555 center/cover;flex:none}
.lb tr.you td{background:rgba(255,255,255,.07)}
.lbtoggle{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:max(10px,env(safe-area-inset-right));width:44px;height:44px;border-radius:12px;border:0;background:rgba(18,18,21,.62);display:grid;place-items:center}
.lbtoggle svg{width:22px;height:22px}
/* game GUI (ForgeGame client: counters, buttons, panels — stud style) */
.gui{position:absolute;inset:0;pointer-events:none;font-family:var(--game)}
.gui *{pointer-events:auto}
.counters{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 62px);display:flex;flex-direction:column;gap:calc(8px * var(--gs));transform-origin:0 0;pointer-events:none}
.cnt{display:flex;align-items:center;gap:6px;width:calc(220px * var(--gs));height:calc(46px * var(--gs));border-radius:calc(14px * var(--gs));padding:0 calc(10px * var(--gs)) 0 calc(6px * var(--gs));color:#fff;font-size:calc(27px * var(--gs));line-height:1;box-shadow:0 0 0 calc(3px * var(--gs)) #14101f inset,0 calc(4px * var(--gs)) 0 rgba(0,0,0,.28);background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--c);
  -webkit-text-stroke:calc(1.6px * var(--gs)) #14101f;paint-order:stroke fill;text-shadow:0 2px 0 #14101f;font-variant-numeric:tabular-nums;transition:transform .2s var(--spring)}
.cnt .ce{width:calc(38px * var(--gs));text-align:center;font-size:calc(26px * var(--gs));-webkit-text-stroke:0;text-shadow:none}
.cnt.bump{transform:scale(1.08)}
.gbtns{position:absolute;right:max(10px,env(safe-area-inset-right));top:52%;translate:0 -50%;display:flex;flex-direction:column;gap:calc(10px * var(--gs))}
.gb{width:calc(190px * var(--gs));height:calc(58px * var(--gs));border:0;border-radius:calc(16px * var(--gs));color:#fff;font:700 calc(22px * var(--gs))/1 var(--game);padding:0 calc(8px * var(--gs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  -webkit-text-stroke:calc(1.4px * var(--gs)) #14101f;paint-order:stroke fill;text-shadow:0 2px 0 #14101f;box-shadow:0 0 0 calc(3px * var(--gs)) #14101f inset,0 calc(5px * var(--gs)) 0 rgba(0,0,0,.3);
  background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--c);transition:transform .2s var(--spring),filter .15s}
.gb:active,.gb.press{transform:scale(.94);filter:brightness(1.12)}
.gb.cd{filter:grayscale(.6) brightness(.8)}
.gtoast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 62px);translate:-50% 0;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.gt{width:100%;min-height:calc(44px * var(--gs));display:grid;place-items:center;text-align:center;border-radius:14px;color:#fff;font-size:calc(21px * var(--gs));padding:6px 10px;-webkit-text-stroke:1.2px #14101f;paint-order:stroke fill;text-shadow:0 2px 0 #14101f;
  box-shadow:0 0 0 3px #14101f inset;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--c);animation:gtin .45s var(--spring)}
.gt.out{animation:gtout .35s var(--ease) forwards}
@keyframes gtin{from{transform:translateY(-14px) scale(.8);opacity:0}}@keyframes gtout{to{transform:translateY(-10px) scale(.9);opacity:0}}
.float{position:absolute;color:#fff;font:700 calc(30px * var(--gs))/1 var(--game);-webkit-text-stroke:1.6px #14101f;paint-order:stroke fill;text-shadow:0 3px 0 #14101f;pointer-events:none;animation:fl 1s var(--ease) forwards;white-space:nowrap}
@keyframes fl{0%{transform:translate(-50%,0) scale(.4);opacity:0}18%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-90px) scale(.9);opacity:0}}
/* panels */
.gpanel{position:absolute;left:50%;top:50%;width:min(94vw,560px);max-height:min(82vh,560px);translate:-50% -50%;border-radius:22px;padding:14px;display:flex;flex-direction:column;color:#fff;
  box-shadow:0 0 0 4px #14101f inset,0 10px 0 rgba(0,0,0,.35),0 30px 60px rgba(0,0,0,.5);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 30%),var(--c);animation:pin .45s var(--spring)}
@keyframes pin{from{transform:scale(.6);opacity:0}}
.gpanel.out{animation:pout .25s ease-in forwards}@keyframes pout{to{transform:scale(.7);opacity:0}}
.gpanel h4{margin:0 0 10px;font:700 30px/1.1 var(--game);-webkit-text-stroke:1.8px #14101f;paint-order:stroke fill;text-shadow:0 3px 0 #14101f;padding-right:54px}
.gpanel .gx{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:12px;border:0;background:#ff4d6d;box-shadow:0 0 0 3px #14101f inset,0 4px 0 rgba(0,0,0,.3);color:#fff;font:700 24px var(--game);-webkit-text-stroke:1px #14101f}
.gbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px;margin:-4px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.item{border-radius:16px;padding:10px;text-align:center;background:rgba(20,16,31,.35);box-shadow:0 0 0 3px #14101f inset;display:flex;flex-direction:column;gap:4px;align-items:center}
.item .ie{font-size:44px;line-height:1.1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.item b{font-size:18px;-webkit-text-stroke:1px #14101f;paint-order:stroke fill;text-shadow:0 2px 0 #14101f;line-height:1.1}
.item small{color:#ffe08a;font-size:14px;-webkit-text-stroke:.8px #14101f;paint-order:stroke fill}
.gbuy{width:100%;height:42px;border:0;border-radius:12px;margin-top:4px;color:#fff;font:700 18px var(--game);-webkit-text-stroke:1px #14101f;paint-order:stroke fill;text-shadow:0 2px 0 #14101f;background:#3dd68c;box-shadow:0 0 0 3px #14101f inset,0 4px 0 rgba(0,0,0,.3)}
.gbuy:disabled{background:#6b7280}.gbuy:active{transform:translateY(2px)}
.gtxt{font-size:20px;line-height:1.3;text-align:center;-webkit-text-stroke:1px #14101f;paint-order:stroke fill;text-shadow:0 2px 0 #14101f;margin:6px 0 12px}
.gbig{width:100%;height:60px;font-size:24px}
.ginput{width:100%;height:56px;border:0;border-radius:14px;background:#fff;color:#14101f;font:700 22px var(--game);text-align:center;box-shadow:0 0 0 3px #14101f inset;margin-bottom:10px;text-transform:uppercase}
.odds{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.odds div{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;background:rgba(20,16,31,.35);box-shadow:0 0 0 3px #14101f inset;font-size:18px;-webkit-text-stroke:.8px #14101f;paint-order:stroke fill}
.odds img{width:40px;height:40px}.odds span{flex:1}.odds em{font-style:normal;color:#ffe08a}
.pets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pets img{width:52px;height:52px;border-radius:12px;background:rgba(20,16,31,.35);box-shadow:0 0 0 3px #14101f inset}
/* mobile controls (Roblox dynamic thumbstick + jump) */
.stickzone{position:absolute;left:0;bottom:0;width:45%;height:55%}
.stick{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.18),rgba(0,0,0,.32));box-shadow:0 0 0 2px rgba(255,255,255,.35) inset;pointer-events:none;opacity:.55;transition:opacity .2s}
.stick.on{opacity:1}
.stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.jump{position:absolute;right:calc(max(18px,env(safe-area-inset-right)) + 12px);bottom:calc(env(safe-area-inset-bottom) + 34px);width:84px;height:84px;border-radius:50%;border:0;background:rgba(0,0,0,.28);box-shadow:0 0 0 2px rgba(255,255,255,.45) inset;display:grid;place-items:center;transition:transform .1s,background .1s}
.jump svg{width:40px;height:40px}
.jump.on{transform:scale(.9);background:rgba(255,255,255,.3)}
body.desktop .stickzone,body.desktop .stick,body.desktop .jump{display:none}
/* hotbar */
.hotbar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);translate:-50% 0;display:flex;gap:6px}
.slot{width:60px;height:60px;border-radius:10px;border:0;background:rgba(18,18,21,.55);box-shadow:0 0 0 2px rgba(255,255,255,.12) inset;position:relative;display:grid;place-items:center;font-size:28px;transition:transform .2s var(--spring)}
.slot i{position:absolute;left:6px;top:3px;font:700 12px var(--ui);font-style:normal;color:#ddd}
.slot span{position:absolute;bottom:3px;left:0;right:0;font:700 9.5px var(--ui);color:#fff;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.slot.on{box-shadow:0 0 0 3px #fff inset;transform:translateY(-4px)}
body:not(.desktop) .hotbar{bottom:calc(env(safe-area-inset-bottom) + 30px)}
body:not(.desktop) .slot{width:56px;height:56px}
/* chat */
.chat{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 60px);width:min(82vw,360px);border-radius:10px;background:rgba(18,18,21,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:600 14px/1.35 var(--ui);transition:opacity .3s}
.chat .log{max-height:150px;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:3px;text-shadow:0 1px 2px #000}
.chat .log b{font-weight:800}
.chat form{display:flex;gap:6px;padding:6px;border-top:1px solid rgba(255,255,255,.1)}
.chat input{flex:1;min-width:0;height:36px;border:0;border-radius:8px;background:rgba(255,255,255,.12);padding:0 10px;font-size:16px}
.chat input::placeholder{color:#bbb}
.chat button{height:36px;border:0;border-radius:8px;padding:0 12px;background:rgba(255,255,255,.18);font-weight:800}
body.chatoff .chat{opacity:0;pointer-events:none}
body.chatoff .counters{top:calc(env(safe-area-inset-top) + 62px)}
body:not(.chatoff) .counters{top:calc(env(safe-area-inset-top) + 262px)}
/* escape menu */
.esc{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);font-family:var(--ui);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.esc .etabs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;width:min(100%,520px)}
.esc .etabs button{flex:1;height:40px;border:0;border-radius:9px;background:none;font-weight:800;font-size:14px;color:#cfd0d6}
.esc .etabs button.on{background:#fff;color:#111}
.esc .ebody{flex:1;width:min(100%,520px);overflow-y:auto;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07)}
.prow i{width:44px;height:44px;border-radius:50%;background:#444 center/cover;flex:none}
.prow b{flex:1}.prow small{color:var(--muted);font-weight:600;display:block;font-size:12px}
.set{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.07)}
.set b{flex:1;font-size:14px}.set input[type=range]{width:46%;accent-color:#fff}
.tog{width:52px;height:30px;border-radius:15px;border:0;background:#555;position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}
.tog.on{background:var(--green)}.tog.on::after{transform:translateX(22px)}
.help{padding:12px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13.5px;line-height:1.6;color:#d9dae0}
.help kbd{background:rgba(255,255,255,.15);border-radius:5px;padding:1px 6px;font:700 12px var(--ui)}
.eacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,520px)}
.eacts button{height:54px;border:0;border-radius:12px;background:rgba(255,255,255,.12);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.eacts button small{font-size:10.5px;color:#bbb;font-weight:700}
.eacts .quit{background:#e5484d}.eacts .res{background:#fff;color:#111}.eacts .res small{color:#555}
/* death + hatch + flash */
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(150,0,0,.55));opacity:0;transition:opacity .4s}
.hatch{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(30,20,60,.55),rgba(0,0,0,.88));overflow:hidden;font-family:var(--game)}
.hatch .rays{position:absolute;left:50%;top:44%;width:180vmax;height:180vmax;margin:-90vmax;background:repeating-conic-gradient(from 0deg,var(--rc) 0 8deg,transparent 8deg 22deg);opacity:0;animation:rays 9s linear infinite;mask:radial-gradient(circle,#000 0,transparent 55%);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes rays{to{transform:rotate(1turn)}}
.hatch.reveal .rays{opacity:.55;transition:opacity .4s}
.egg{position:absolute;left:50%;top:44%;width:150px;height:190px;margin:-95px 0 0 -75px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 28%,#fff 0 8%,transparent 30%),radial-gradient(circle at 50% 60%,var(--ec1),var(--ec2));box-shadow:0 0 0 5px #14101f inset,0 25px 40px rgba(0,0,0,.4);overflow:hidden}
.egg::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 70%,rgba(255,255,255,.35) 0 7%,transparent 8%),radial-gradient(circle at 72% 45%,rgba(255,255,255,.3) 0 9%,transparent 10%),radial-gradient(circle at 55% 85%,rgba(255,255,255,.25) 0 6%,transparent 7%)}
.egg svg{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.egg.c1 svg .k1,.egg.c2 svg .k1,.egg.c2 svg .k2,.egg.c3 svg *{opacity:1}
.egg.c1 svg,.egg.c2 svg,.egg.c3 svg{opacity:1}
.egg svg path{opacity:0;transition:opacity .1s}
.egg.boom{animation:boom .35s ease-out forwards}
@keyframes boom{to{transform:scale(1.6);opacity:0;filter:brightness(4)}}
.petr{position:absolute;left:50%;top:44%;width:230px;height:230px;margin:-115px;opacity:0;transform:scale(.2) rotate(-20deg)}
.hatch.reveal .petr{animation:petin .9s var(--spring) forwards}
@keyframes petin{to{opacity:1;transform:none}}
.petr img{width:100%;height:100%;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
.hname{position:absolute;left:0;right:0;top:calc(44% + 130px);text-align:center;opacity:0;transform:translateY(20px)}
.hatch.reveal .hname{animation:hn .6s .35s var(--spring) forwards}
@keyframes hn{to{opacity:1;transform:none}}
.hname b{display:block;font-size:44px;color:#fff;-webkit-text-stroke:2.4px #14101f;paint-order:stroke fill;text-shadow:0 4px 0 #14101f}
.hname em{display:inline-block;font-style:normal;margin-top:6px;font-size:22px;padding:4px 14px;border-radius:12px;color:#fff;background:var(--rc);box-shadow:0 0 0 3px #14101f inset;-webkit-text-stroke:1px #14101f;paint-order:stroke fill}
.hname small{display:block;color:#ffe08a;font-size:22px;margin-top:8px;-webkit-text-stroke:1px #14101f;paint-order:stroke fill}
.hatch .tap{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 30px);left:0;right:0;text-align:center;color:#fff;font:700 15px var(--ui);opacity:0;animation:fade .4s 1.2s forwards}
.spark{position:absolute;width:10px;height:10px;border-radius:2px;background:var(--rc);left:50%;top:44%}
.fps{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 8px);translate:-50% 0;font:700 11px var(--ui);background:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px;pointer-events:none}
.respawn{position:absolute;left:50%;top:38%;translate:-50% 0;font:800 18px var(--ui);color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .4s}
.respawn.on{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);translate:-50% 0;background:#2c2e33;border-radius:12px;padding:11px 16px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .25s,transform .25s var(--spring);pointer-events:none;z-index:60;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateY(10px)}
#toast.on{opacity:1;transform:none}
@media (min-width:900px){.wide{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.tile,.thumb{width:180px}.thumb{height:180px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<!-- ===== HOME ===== -->
<section class="scr" id="home">
  <header class="top"><span class="logo" aria-hidden="true"></span><h1>Jouer<small>tes jeux Roblox Forge, dans le navigateur</small></h1>
    <button class="ico" id="importBtn" aria-label="Importer un jeu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4 16v2.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V16"/></svg></button>
    <button class="me" id="meBtn" aria-label="Mon avatar"><img id="meImg" alt=""></button></header>
  <div class="feed" id="feed"></div>
  <input type="file" id="file" accept=".zip,.json,application/zip,application/json" hidden>
</section>

<!-- ===== AVATAR ===== -->
<section class="scr" id="avatar" hidden>
  <header class="top"><button class="ico" id="avBack" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Avatar<small>ton personnage dans tous les jeux</small></h1></header>
  <div class="stage" id="avStage"></div>
  <div class="opts" id="avOpts"></div>
</section>

<nav class="tabs" id="tabs">
  <button class="on" data-tab="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l9 7.6v9.2a1 1 0 01-1 1h-5.5v-6h-5v6H4a1 1 0 01-1-1v-9.2z"/></svg>Accueil</button>
  <button data-tab="avatar"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="2.5" width="8" height="7" rx="2"/><rect x="6.5" y="10.5" width="11" height="6.5" rx="1.5"/><rect x="3" y="10.5" width="3" height="6" rx="1"/><rect x="18" y="10.5" width="3" height="6" rx="1"/><rect x="7.5" y="17.5" width="4" height="4.5" rx="1"/><rect x="12.5" y="17.5" width="4" height="4.5" rx="1"/></svg>Avatar</button>
  <button data-tab="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4 16v2.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V16"/></svg>Importer</button>
  <a href="../create/"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.2 5.6 5.8 1.8-5.8 1.8L12 17.3l-2.2-5.6L4 9.9l5.8-1.8z"/><path d="M19 15l.9 2.2 2.1.8-2.1.8L19 21l-.9-2.2-2.1-.8 2.1-.8z"/></svg>Créer</a>
</nav>

<!-- ===== GAME PAGE ===== -->
<div class="sheet" id="sheet"><div class="pane" id="pane"></div></div>

<!-- ===== JOIN / LOADING ===== -->
<section class="scr" id="loading" hidden><div class="bgimg" id="lBg"></div>
  <div class="box"><div class="lthumb" id="lThumb"></div><h3 id="lTitle"></h3><div class="by">par <b>Roblox Forge</b></div>
    <div class="spin"><i></i><i></i></div><div class="lt" id="lText">Connexion…</div><div class="lbar"><i id="lBar"></i></div></div></section>

<!-- ===== IN GAME ===== -->
<section class="scr" id="game" hidden>
  <div class="hud" id="hud">
    <div class="gui" id="gui"><div class="counters" id="counters"></div><div class="gbtns" id="gbtns"></div><div class="gtoast" id="gtoast"></div><div id="floats"></div></div>
    <div class="stickzone" id="stickzone"></div><div class="stick" id="stick"><i id="knob"></i></div>
    <button class="jump" id="jumpBtn" aria-label="Sauter"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.5L12 8l6.5 6.5"/></svg></button>
    <div class="hotbar" id="hotbar"></div>
    <div class="chat" id="chat"><div class="log" id="chatLog"></div><form id="chatForm"><input id="chatIn" maxlength="120" autocomplete="off" placeholder="Pour discuter, appuie ici ou sur la touche « / »" enterkeyhint="send"><button>Envoyer</button></form></div>
    <div class="tb"><div class="pill"><button id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><rect x="4.6" y="4.6" width="14.8" height="14.8" rx="2.4" fill="none" stroke="#fff" stroke-width="2.6" transform="rotate(14 12 12)"/><rect x="10.2" y="10.2" width="3.6" height="3.6" fill="#fff" transform="rotate(14 12 12)"/></svg></button></div>
      <div class="pill"><button id="chatBtn" aria-label="Discussion"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linejoin="round"><path d="M4 5.5h16v10H10l-4.5 3.5V15.5H4z"/></svg><span class="dot" id="chatDot" hidden></span></button>
      <button id="emoteBtn" aria-label="Emotes"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14c1 1.4 2.1 2 3.5 2s2.5-.6 3.5-2"/><circle cx="9" cy="10" r=".6" fill="#fff"/><circle cx="15" cy="10" r=".6" fill="#fff"/></svg></button>
      <button id="lbBtn" aria-label="Classement"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><path d="M15.5 6.2a3 3 0 010 5.6M17.5 14.4c1.6.7 2.7 2.3 3 4.6"/></svg></button>
      <button id="slBtn" class="pc" aria-label="Shift Lock"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"><rect x="6" y="10.5" width="12" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5"/><circle cx="12" cy="15" r="1.2" fill="#fff"/></svg></button></div></div>
    <div class="hp" id="hp" hidden><i></i></div>
    <div class="xhair" id="xhair" hidden></div>
    <div class="lb" id="lb"></div>
    <div class="vign" id="vign"></div><div class="flash" id="flash"></div><div class="respawn" id="respawnT">Réapparition…</div><div class="fps" id="fps" hidden></div>
  </div>
</section>
<div id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
